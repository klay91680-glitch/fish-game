<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fish Game</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#001a33;
font-family:sans-serif;
}

/* Landscape Screen */
#game{
position:absolute;
top:50%;
left:50%;

width:100vh;
height:100vw;

transform:translate(-50%,-50%) rotate(90deg);
transform-origin:center center;

overflow:hidden;

background:
linear-gradient(
to bottom,
#002b5c 0%,
#0067a5 50%,
#00a8d8 100%
);
}

/* Top Bar */
.topbar{
position:absolute;
top:10px;
left:10px;
right:10px;

display:flex;
justify-content:space-between;
align-items:center;

z-index:100;
}

.coins{
background:rgba(0,0,0,.4);
padding:10px 20px;
border-radius:20px;
color:gold;
font-size:22px;
font-weight:bold;
}

.bet{
display:flex;
gap:10px;
}

.bet button{
border:none;
padding:10px 20px;
border-radius:10px;
font-size:18px;
}

/* Fish */
.fish{
position:absolute;
font-size:45px;
user-select:none;
}

.f1{
top:80px;
animation:swim1 18s linear infinite;
}

.f2{
top:200px;
animation:swim2 15s linear infinite;
}

.f3{
top:320px;
animation:swim1 20s linear infinite;
}

.f4{
top:440px;
animation:swim2 12s linear infinite;
}

.whale{
top:150px;
font-size:90px;
animation:swim1 30s linear infinite;
opacity:.8;
}

@keyframes swim1{
from{
left:-150px;
}
to{
left:120%;
}
}

@keyframes swim2{
from{
left:120%;
transform:scaleX(-1);
}
to{
left:-150px;
transform:scaleX(-1);
}
}

/* Bottom Control */
.controls{
position:absolute;
bottom:20px;
left:0;
right:0;

display:flex;
justify-content:center;
align-items:center;
gap:20px;

z-index:100;
}

.btn{
width:70px;
height:70px;
border-radius:50%;
border:none;
font-size:35px;
font-weight:bold;
}

.minus{
background:white;
}

.plus{
background:white;
}

.cannon{
font-size:70px;
}

.auto{
position:absolute;
bottom:20px;
left:20px;

background:red;
color:white;

border:none;
padding:15px 25px;
border-radius:15px;
font-size:20px;
}

.gift{
position:absolute;
bottom:20px;
right:20px;

background:purple;
color:white;

border:none;
padding:15px 25px;
border-radius:15px;
font-size:20px;
}
</style>
</head>

<body>

<div id="game">

<div class="topbar">

<div class="coins">
💰 Coins : <span id="coin">1000</span>
</div>

<div class="bet">
<button>10</button>
<button>50</button>
<button>100</button>
</div>

</div>

<div class="fish f1">🐠</div>
<div class="fish f2">🐟</div>
<div class="fish f3">🐡</div>
<div class="fish f4">🦈</div>
<div class="fish whale">🐋</div>

<button class="auto">AUTO</button>

<div class="controls">
<button class="btn minus">-</button>

<div class="cannon">🔫</div>

<button class="btn plus">+</button>
</div>

<button class="gift">🎁</button>

</div>

</body>
</html>
