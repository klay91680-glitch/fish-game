<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fish Game</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:#001b3d;
font-family:sans-serif;
}

#game{
width:100vw;
height:100vh;
position:relative;
background:
linear-gradient(#003c75,#00a7d8);
overflow:hidden;
}

.coin{
position:absolute;
top:10px;
left:10px;
color:gold;
font-size:20px;
font-weight:bold;
z-index:100;
}

.power{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
z-index:100;
}

.power button{
padding:6px 12px;
border:none;
border-radius:8px;
margin:2px;
}

.cannon{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
font-size:70px;
z-index:50;
}

.minus{
position:absolute;
bottom:40px;
left:30%;
width:60px;
height:60px;
border-radius:50%;
border:none;
font-size:30px;
}

.plus{
position:absolute;
bottom:40px;
right:30%;
width:60px;
height:60px;
border-radius:50%;
border:none;
font-size:30px;
}

.auto{
position:absolute;
left:10px;
bottom:120px;
padding:15px;
background:red;
color:white;
border:none;
border-radius:15px;
}

.gift{
position:absolute;
right:10px;
bottom:120px;
padding:15px;
background:purple;
color:white;
border:none;
border-radius:15px;
}

.fish{
position:absolute;
font-size:45px;
cursor:pointer;
user-select:none;
}

.big{
font-size:80px;
}

</style>
</head>

<body>

<div id="game">

<div class="coin">
💰 Coins :
<span id="coin">1000</span>
</div>

<div class="power">
<button>10</button>
<button>50</button>
<button>100</button>
</div>

<button class="auto">AUTO</button>
<button class="gift">🎁</button>

<button class="minus">−</button>
<button class="plus">+</button>

<div class="cannon">
🔫
</div>

</div>

<script>

let coins=1000;

function updateCoin(){
document.getElementById("coin").innerText=coins;
}

function createFish(){

let fish=document.createElement("div");

fish.className="fish";

let types=[
"🐟",
"🐠",
"🐡",
"🦈"
];

fish.innerHTML=
types[Math.floor(Math.random()*types.length)];

if(Math.random()<0.1){
fish.innerHTML="🐋";
fish.classList.add("big");
}

fish.style.left="-100px";
fish.style.top=
Math.random()*70+"vh";

document.getElementById("game")
.appendChild(fish);

let x=-100;

let speed=
2+
Math.random()*3;

let move=setInterval(()=>{

x+=speed;

fish.style.left=x+"px";

if(x>window.innerWidth+100){

clearInterval(move);

fish.remove();

}

},20);

fish.onclick=function(){

coins+=20;

updateCoin();

fish.innerHTML="💥";

setTimeout(()=>{
fish.remove();
},200);

};

}

setInterval(createFish,800);

</script>

</body>
</html>
