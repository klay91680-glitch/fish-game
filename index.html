<style>
  *{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#001b3d;
font-family:Arial,sans-serif;
}

#game{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;

background:linear-gradient(
to bottom,
#002b5c 0%,
#005e9e 50%,
#00a8d8 100%
);
}

/* Top Bar */
#topBar{
position:absolute;
top:10px;
left:10px;
right:10px;
z-index:100;

display:flex;
justify-content:space-between;
align-items:center;
}

#coins{
background:rgba(0,0,0,.4);
color:gold;
padding:8px 15px;
border-radius:15px;
font-size:20px;
font-weight:bold;
}

#betBox button{
border:none;
padding:8px 15px;
margin-left:5px;
border-radius:10px;
font-size:18px;
}

/* Fish */
.fish{
position:absolute;
font-size:42px;
cursor:pointer;
user-select:none;
}

/* Cannon */
#cannon{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
font-size:60px;
z-index:100;
}

/* Controls */
#controls{
position:absolute;
bottom:20px;
left:20px;
right:20px;

display:flex;
justify-content:space-between;
align-items:center;

z-index:100;
}

.controlBtn{
border:none;
padding:15px 20px;
border-radius:15px;
font-size:20px;
font-weight:bold;
}

#autoBtn{
background:red;
color:white;
}

#giftBtn{
background:purple;
color:white;
}

/* Result Text */
#message{
position:absolute;
top:60px;
left:50%;
transform:translateX(-50%);
color:yellow;
font-size:24px;
font-weight:bold;
z-index:200;
  }</style>
</head>
<body>

<div id="game">

    <!-- Top Bar -->
    <div id="topBar">

        <div id="coins">
            💰 Coins :
            <span id="coinValue">1000</span>
        </div>

        <div id="betBox">
            <button onclick="setBet(10)">10</button>
            <button onclick="setBet(50)">50</button>
            <button onclick="setBet(100)">100</button>
        </div>

    </div>

    <!-- Message -->
    <div id="message"></div>

    <!-- Fish Area -->
    <div id="fishArea">

        <div class="fish" id="fish1">🐠</div>
        <div class="fish" id="fish2">🐟</div>
        <div class="fish" id="fish3">🐡</div>
        <div class="fish" id="fish4">🦈</div>
        <div class="fish" id="fish5">🐋</div>

    </div>

    <!-- Controls -->
    <div id="controls">

        <button class="controlBtn" id="autoBtn">
            AUTO
        </button>

        <div id="cannon">
            🔫
        </div>

        <button class="controlBtn" id="giftBtn">
            🎁
        </button>

    </div>

</div>

<script>
let coins = localStorage.getItem("coins")
 ? parseInt(localStorage.getItem("coins"))
 : 1000;
function updateCoins(){
    document.getElementById("coinValue").innerText = coins;
    localStorage.setItem("coins", coins);
}

let bet = 10;
  

function setBet(value){
    bet = value;

    document.getElementById("message").innerText =
    "🎯 Bet : " + bet;
}

updateCoins();
  const fishIds = ["fish1","fish2","fish3","fish4","fish5"];

function startFish(fishId){

    const fish = document.getElementById(fishId);

    let y = Math.random() * (window.innerHeight - 200);

    fish.style.top = y + "px";

    let leftToRight = Math.random() > 0.5;

    let x = leftToRight ? -100 : window.innerWidth + 100;

    fish.style.left = x + "px";

    if(leftToRight){
        fish.style.transform = "scaleX(1)";
    }else{
        fish.style.transform = "scaleX(-1)";
    }

    let speed = 2 + Math.random() * 3;

    setInterval(()=>{

        if(leftToRight){
            x += speed;
        }else{
            x -= speed;
        }

        fish.style.left = x + "px";

        if(x > window.innerWidth + 150){
            x = -100;
            fish.style.top =
            Math.random() * (window.innerHeight - 200) + "px";
        }

        if(x < -150){
            x = window.innerWidth + 100;
            fish.style.top =
            Math.random() * (window.innerHeight - 200) + "px";
        }

    },30);

}

fishIds.forEach(id=>{
    startFish(id);
});
  fishIds.forEach(id=>{

    const fish = document.getElementById(id);
/*
    fish.addEventListener("click",function(){
if(coins < bet){
    document.getElementById("message").innerText =
    "❌ Coins မလုံလောက်ပါ";
    return;
}

coins -= bet;
updateCoins();

let hit = Math.random() < 0.5;

if(!hit){
    document.getElementById("message").innerText =
    "💨 Miss!";
    return;
}

let reward = 0;

if(id==="fish1") reward = bet * 2;
if(id==="fish2") reward = bet * 3;
if(id==="fish3") reward = bet * 4;
if(id==="fish4") reward = bet * 5;
if(id==="fish5") reward = bet * 10;

coins += reward;;

        updateCoins();

        document.getElementById("message").innerText =
        "🎉 +" + reward + " Coins";

        fish.innerHTML = "💥";

        setTimeout(()=>{

            if(id==="fish1") fish.innerHTML="🐠";
            if(id==="fish2") fish.innerHTML="🐟";
            if(id==="fish3") fish.innerHTML="🐡";
            if(id==="fish4") fish.innerHTML="🦈";
            if(id==="fish5") fish.innerHTML="🐋";

        },300);

    });*/

});
  document.getElementById("autoBtn").addEventListener("click",function(){

    document.getElementById("message").innerText =
    "AUTO Mode (Demo)";

});

document.getElementById("giftBtn").addEventListener("click",function(){

  let giftReady = true;

document.getElementById("giftBtn").addEventListener("click", function(){

    if(!giftReady){
        document.getElementById("message").innerText =
        "⏳ Wait 1 minute!";
        return;
    }

    let gift = 100;

    coins += gift;

    updateCoins();

    document.getElementById("message").innerText =
    "🎁 Gift +" + gift;

    giftReady = false;

    setTimeout(()=>{
        giftReady = true;
    },60000);

});

});

/* Start Message */
function shoot() {

    if (coins < bet) {
        document.getElementById("message").innerText = "❌ Coins မလုံလောက်ပါ";
        return;
    }

    coins -= bet;
    updateCoins();

    let hitFish = null;

    fishIds.forEach(id => {

        const fish = document.getElementById(id);
        const rect = fish.getBoundingClientRect();

        const centerX = window.innerWidth / 2;
        const cannonY = window.innerHeight - 120;

        if (
            centerX >= rect.left &&
            centerX <= rect.right &&
            cannonY >= rect.top &&
            cannonY <= rect.bottom
        ) {
            hitFish = fish;
        }
    });

    if (!hitFish) {
        document.getElementById("message").innerText = "💨 Miss!";
        return;
    }

    let reward = bet * 2;

    coins += reward;
    updateCoins();

    document.getElementById("message").innerText =
    "🎉 +" + reward;
}

const cannon = document.getElementById("cannon");

cannon.addEventListener("click", shoot);

let autoShoot;

cannon.addEventListener("touchstart", (e) => {
    e.preventDefault();
    autoShoot = setInterval(shoot, 200);
});

cannon.addEventListener("touchend", () => {
    clearInterval(autoShoot);
});

cannon.addEventListener("touchcancel", () => {
    clearInterval(autoShoot);
});
  </script>
</body>
