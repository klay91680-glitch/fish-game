<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Fish Hunter</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:black;
}

#rotate{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
color:white;
display:none;
justify-content:center;
align-items:center;
font-size:28px;
z-index:9999;
}

#game{
width:100vw;
height:100vh;
position:relative;
overflow:hidden;
background:
linear-gradient(to bottom,#001a4d,#0088cc);
}

/* Coins */

#coins{
position:absolute;
top:10px;
left:10px;
background:rgba(0,0,0,.5);
padding:8px 15px;
border-radius:10px;
color:gold;
font-weight:bold;
z-index:100;
}

/* Power */

#power{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
z-index:100;
}

#power button{
padding:8px 15px;
margin:2px;
border:none;
border-radius:8px;
font-weight:bold;
}

/* Cannon */

#cannon{
position:absolute;
bottom:15px;
left:50%;
transform:translateX(-50%);
font-size:70px;
z-index:50;
}

/* Minus Plus */

.minus{
position:absolute;
bottom:30px;
left:35%;
width:60px;
height:60px;
border:none;
border-radius:50%;
font-size:30px;
}

.plus{
position:absolute;
bottom:30px;
right:35%;
width:60px;
height:60px;
border:none;
border-radius:50%;
font-size:30px;
}

/* Side Buttons */

.auto{
position:absolute;
left:10px;
bottom:120px;
background:red;
color:white;
border:none;
padding:15px;
border-radius:12px;
}

.gift{
position:absolute;
right:10px;
bottom:120px;
background:purple;
color:white;
border:none;
padding:15px;
border-radius:12px;
}

/* Fish */

.fish{
position:absolute;
font-size:50px;
cursor:pointer;
user-select:none;
}

.big{
font-size:90px;
}

.hit{
animation:pop .3s linear;
}

@keyframes pop{
0%{transform:scale(1);}
50%{transform:scale(1.5);}
100%{transform:scale(0);}
}

</style>
</head>

<body>

<div id="rotate">
📱 ဖုန်းကို အစောင်းလှည့်ပြီး ကစားပါ
</div>

<div id="game">

<div id="coins">
💰 Coins : <span id="coinText">1000</span>
</div>

<div id="power">
<button>10</button>
<button>50</button>
<button>100</button>
</div>

<button class="auto">AUTO</button>

<button class="gift">🎁</button>

<button class="minus">−</button>

<div id="cannon">🔫</div>

<button class="plus">+</button>

</div>

<script>

let coins=1000;

function updateCoins(){
document.getElementById("coinText").innerHTML=coins;
}

/* Orientation */

function checkOrientation(){

if(window.innerHeight > window.innerWidth){

document.getElementById("rotate").style.display="flex";

document.getElementById("game").style.display="none";

}else{

document.getElementById("rotate").style.display="none";

document.getElementById("game").style.display="block";

}

}

window.addEventListener("resize",checkOrientation);

checkOrientation();

/* Fish Create */

function createFish(){

let fish=document.createElement("div");

fish.className="fish";

let types=[
"🐟",
"🐠",
"🐡",
"🦈"
];

fish.innerHTML=
types[Math.floor(Math.random()*types.length)];

if(Math.random()<0.1){

fish.innerHTML="🐋";

fish.classList.add("big");

}

fish.style.left="-100px";

fish.style.top=
Math.random()*(window.innerHeight-250)+"px";

document.getElementById("game").appendChild(fish);

let x=-100;

let speed=2+Math.random()*4;

let move=setInterval(()=>{

x+=speed;

fish.style.left=x+"px";

if(x>window.innerWidth+100){

clearInterval(move);

fish.remove();

}

},20);

fish.onclick=function(){

coins+=20;

updateCoins();

fish.classList.add("hit");

fish.innerHTML="💥";

setTimeout(()=>{
fish.remove();
},300);

};

}

setInterval(createFish,700);

</script>

</body>
</html>
