<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ငါးပြစ်ဂိမ်း</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:url('https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=1200') center/cover;
height:100vh;
font-family:sans-serif;
}

#game{
width:100%;
height:100vh;
position:relative;
}

.top{
position:absolute;
top:10px;
left:10px;
z-index:100;
background:rgba(0,0,0,.6);
padding:10px;
border-radius:10px;
color:#fff;
}

.coin-select{
position:absolute;
top:10px;
right:10px;
z-index:100;
display:flex;
gap:5px;
}

.coin-btn{
padding:10px;
border:none;
border-radius:10px;
font-weight:bold;
}

.fish{
position:absolute;
font-size:50px;
cursor:pointer;
animation:swim 15s linear infinite;
}

@keyframes swim{
from{
left:-100px;
}
to{
left:110%;
}
}

.cannon{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
font-size:80px;
}

.shoot{
position:absolute;
bottom:30px;
right:20px;
width:100px;
height:100px;
border-radius:50%;
background:red;
color:white;
border:none;
font-size:30px;
font-weight:bold;
box-shadow:0 0 20px red;
}

.minus,.plus{
width:50px;
height:50px;
border-radius:50%;
border:none;
font-size:25px;
font-weight:bold;
}

.controls{
position:absolute;
bottom:30px;
left:20px;
display:flex;
gap:10px;
}

#msg{
position:absolute;
top:80px;
left:50%;
transform:translateX(-50%);
color:yellow;
font-size:28px;
font-weight:bold;
}
</style>
</head>

<body>

<div id="game">

<div class="top">
💰 Coins :
<span id="coins">1000</span>
</div>

<div class="coin-select">
<button class="coin-btn" onclick="bet=10">10</button>
<button class="coin-btn" onclick="bet=50">50</button>
<button class="coin-btn" onclick="bet=100">100</button>
</div>

<div id="msg"></div>

<div class="controls">
<button class="minus" onclick="bet=Math.max(10,bet-10)">➖</button>
<button class="plus" onclick="bet+=10">➕</button>
</div>

<div class="cannon">🔫</div>

<button class="shoot" onclick="shootFish()">FIRE</button>

</div>

<script>

let coins=1000;
let bet=10;

function updateCoins(){
document.getElementById("coins").innerText=coins;
}

function createFish(){

const fish=document.createElement("div");

fish.className="fish";

const fishes=["🐟","🐠","🐡","🦈"];

fish.innerHTML=fishes[Math.floor(Math.random()*fishes.length)];

fish.style.top=Math.random()*80+"%";

fish.onclick=function(){

coins+=bet;

updateCoins();

document.getElementById("msg").innerHTML=
"🎯 +"+bet+" Coins";

fish.remove();

};

document.getElementById("game").appendChild(fish);

setTimeout(()=>{
fish.remove();
},15000);

}

function shootFish(){

coins-=bet;

updateCoins();

document.getElementById("msg").innerHTML=
"💥 ပစ်လိုက်ပြီ -"+bet;

}

setInterval(createFish,1500);

updateCoins();

</script>

</body>
</html>
