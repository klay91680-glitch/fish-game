<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>🐟 ငါးပစ်ဂိမ်း</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#001b3d;
    touch-action:none;
    user-select:none;
}

/* ================= LOGIN ================= */

#loginPage{
    position:fixed;
    inset:0;
    z-index:2000;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#001b3d,#003d7a,#0066b3);
}

#loginBox{
    width:90%;
    max-width:380px;
    padding:30px 22px;
    text-align:center;
    background:rgba(0,0,0,.75);
    border:2px solid rgba(255,215,0,.35);
    border-radius:24px;
    box-shadow:0 0 50px rgba(0,120,255,.25);
}

#loginBox h1{
    color:#ffd700;
    font-size:27px;
    margin-bottom:7px;
}

.loginSub{
    color:#88ddff;
    font-size:14px;
    margin-bottom:20px;
}

#loginBox input{
    width:100%;
    padding:13px 15px;
    margin:6px 0;
    border-radius:12px;
    border:2px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.08);
    color:white;
    font-size:16px;
    outline:none;
}

#loginBox input:focus{
    border-color:#ffd700;
}

#loginBox input::placeholder{
    color:rgba(255,255,255,.45);
}

.loginBtn{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:0;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
}

#loginBtn{
    background:linear-gradient(135deg,#ffd700,#f0a500);
    color:#001b3d;
}

#registerBtn{
    background:transparent;
    color:#88ddff;
    border:2px solid #88ddff;
}

#guestBtn{
    background:linear-gradient(135deg,#00b894,#008f72);
    color:white;
}

#switchLink{
    display:inline-block;
    margin-top:10px;
    color:#88ddff;
    font-size:13px;
    text-decoration:underline;
}

#loginError{
    min-height:24px;
    margin:6px 0;
    color:#ff7777;
    font-size:13px;
}

/* ================= GAME ================= */

#gamePage{
    display:none;
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
    linear-gradient(
        to bottom,
        #002b5c 0%,
        #005e9e 50%,
        #00a8d8 100%
    );
}

/* bubbles */

.bubble{
    position:absolute;
    border:2px solid rgba(255,255,255,.35);
    border-radius:50%;
    pointer-events:none;
    animation:bubbleMove linear infinite;
}

@keyframes bubbleMove{
    from{
        transform:translateY(100vh);
        opacity:0;
    }
    20%{opacity:.7}
    100%{
        transform:translateY(-120px);
        opacity:0;
    }
}

/* ================= TOP ================= */

#topBar{
    position:absolute;
    top:7px;
    left:7px;
    right:7px;
    z-index:500;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:4px;
}

.info{
    background:rgba(0,0,0,.6);
    color:white;
    padding:5px 9px;
    border-radius:10px;
    font-size:12px;
    font-weight:bold;
}

#scoreValue{
    color:#ffe600;
}

#coinDisplay{
    display:flex;
    align-items:center;
    gap:5px;
    padding:5px 12px;
    border-radius:20px;
    background:radial-gradient(
        circle at 30% 30%,
        #ffd700,
        #e6a800,
        #b8860b
    );
    border:2px solid #fff8dc;
    color:white;
    font-weight:bold;
    box-shadow:0 0 20px rgba(255,215,0,.4);
}

#coinValue{
    font-size:15px;
}

#userInfo{
    padding:5px 12px;
    border-radius:18px;
    background:linear-gradient(135deg,#00ccff,#0088cc);
    color:white;
    font-size:12px;
    font-weight:bold;
    border:1px solid #66ddff;
}

#logoutBtn{
    border:1px solid rgba(255,0,0,.6);
    border-radius:12px;
    padding:5px 10px;
    background:rgba(255,0,0,.3);
    color:white;
}

/* ================= MESSAGE ================= */

#message{
    position:absolute;
    top:55px;
    left:50%;
    transform:translateX(-50%);
    z-index:600;
    color:#fff45c;
    font-weight:bold;
    font-size:15px;
    white-space:nowrap;
    text-shadow:0 0 10px black;
}

/* ================= FISH ================= */

.fish{
    position:absolute;
    font-size:45px;
    z-index:30;
    pointer-events:none;
    width:70px;
    height:55px;
    text-align:center;
}

.fishHP{
    position:absolute;
    left:50%;
    bottom:-2px;
    transform:translateX(-50%);
    width:42px;
    height:5px;
    background:rgba(255,0,0,.5);
    border-radius:5px;
    overflow:hidden;
}

.fishHPbar{
    height:100%;
    width:100%;
    background:#00ff4c;
}

/* ================= CANNON ================= */

#cannon{
    position:absolute;
    left:50%;
    bottom:15px;
    width:80px;
    height:80px;
    transform:translateX(-50%);
    z-index:400;
}

#barrel{
    position:absolute;
    left:50%;
    top:58%;
    width:19px;
    height:58px;
    transform:translate(-50%,-100%);
    transform-origin:50% 100%;
    background:linear-gradient(
        to right,
        #063a5e,
        #55e5ff,
        #0876a8
    );
    border:2px solid #052e4d;
    border-radius:10px 10px 4px 4px;
    box-shadow:0 0 12px rgba(0,220,255,.8);
}

#muzzle{
    position:absolute;
    left:50%;
    top:-6px;
    width:25px;
    height:13px;
    transform:translateX(-50%);
    background:#062d49;
    border:2px solid #55ddff;
    border-radius:6px;
}

#cannonBase{
    position:absolute;
    left:50%;
    bottom:0;
    width:58px;
    height:30px;
    transform:translateX(-50%);
    background:linear-gradient(#35d8ff,#0871a8);
    border:3px solid #063c60;
    border-radius:16px 16px 6px 6px;
}

/* ================= BULLET ================= */

.bullet{
    position:absolute;
    width:8px;
    height:19px;
    border-radius:9px;
    background:#fff36b;
    box-shadow:
    0 0 8px white,
    0 0 16px #ffe600;
    z-index:450;
}

/* ================= CONTROLS ================= */

#controls{
    position:absolute;
    left:8px;
    right:8px;
    bottom:10px;
    z-index:500;
    display:flex;
    align-items:center;
    gap:5px;
}

.controlBtn{
    border:0;
    padding:8px 10px;
    border-radius:10px;
    color:white;
    font-size:11px;
    font-weight:bold;
}

#autoBtn{
    background:#e00000;
}

#chatBtn{
    background:#0088cc;
}

/* ================= SHOT POWER ================= */

#shotBox{
    display:flex;
    gap:4px;
    margin-left:auto;
}

.shotBtn{
    min-width:42px;
    padding:8px 5px;
    border:2px solid rgba(255,255,255,.3);
    border-radius:9px;
    background:rgba(0,0,0,.5);
    color:white;
    font-weight:bold;
    font-size:10px;
}

.shotBtn.active{
    background:#ffd700;
    color:#001b3d;
    border-color:#fff;
    box-shadow:0 0 12px rgba(255,215,0,.8);
}

/* ================= CHAT ================= */

#chatBox{
    display:none;
    position:fixed;
    right:10px;
    bottom:65px;
    width:min(350px,92vw);
    height:400px;
    z-index:1500;
    background:rgba(0,20,45,.98);
    border:2px solid #55ddff;
    border-radius:18px;
    box-shadow:0 0 30px rgba(0,200,255,.35);
    overflow:hidden;
}

#chatHeader{
    height:48px;
    padding:0 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:white;
    font-weight:bold;
    background:linear-gradient(135deg,#006b9c,#003d70);
}

#closeChat{
    border:0;
    background:transparent;
    color:white;
    font-size:20px;
}

#chatMessages{
    height:295px;
    padding:10px;
    overflow-y:auto;
}

.chatMsg{
    padding:8px 10px;
    margin-bottom:7px;
    border-radius:10px;
    background:rgba(255,255,255,.08);
    color:white;
    font-size:13px;
}

.chatUser{
    color:#55ddff;
    font-weight:bold;
    font-size:11px;
}

.chatTime{
    color:#777;
    font-size:9px;
    margin-top:3px;
}

#chatInputArea{
    height:57px;
    display:flex;
    gap:5px;
    padding:8px;
    border-top:1px solid rgba(255,255,255,.15);
}

#chatInput{
    flex:1;
    min-width:0;
    padding:9px;
    border-radius:10px;
    border:1px solid #55ddff;
    background:#001b3d;
    color:white;
    outline:none;
}

#sendChat{
    border:0;
    border-radius:10px;
    padding:0 13px;
    background:#00a8d8;
    color:white;
    font-weight:bold;
}

/* ================= EFFECT ================= */

.hitEffect{
    position:absolute;
    z-index:700;
    font-size:24px;
    pointer-events:none;
    animation:hit .3s linear;
}

@keyframes hit{
    from{
        transform:scale(.5);
        opacity:1;
    }
    to{
        transform:scale(1.5);
        opacity:0;
    }
}

.coinFloat{
    position:absolute;
    z-index:800;
    color:#ffe600;
    font-size:18px;
    font-weight:bold;
    pointer-events:none;
    animation:coinFloat .8s ease-out forwards;
    text-shadow:0 0 8px #000;
}

@keyframes coinFloat{
    from{
        transform:translateY(0);
        opacity:1;
    }
    to{
        transform:translateY(-45px);
        opacity:0;
    }
}

@media(max-width:600px){

    .info{
        font-size:10px;
        padding:3px 6px;
    }

    #userInfo{
        font-size:10px;
        padding:3px 8px;
    }

    #coinDisplay{
        padding:4px 9px;
        font-size:10px;
    }

    #coinValue{
        font-size:12px;
    }

    .fish{
        font-size:38px;
    }

    #message{
        font-size:13px;
    }

    .controlBtn{
        font-size:9px;
        padding:7px 7px;
    }

    .shotBtn{
        min-width:38px;
        font-size:9px;
        padding:7px 3px;
    }
}
.fishHP,.fishHPbar{display:none!important;}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage">

<div id="loginBox">

<h1>🐟 ငါးပစ်ဂိမ်း</h1>

<div class="loginSub" id="loginSubTitle">
အကောင့်ဝင်ရန်
</div>

<input
id="loginUsername"
type="text"
autocomplete="username"
placeholder="👤 အကောင့်အမည်">

id="loginPassword"
type="password"
autocomplete="current-password"
placeholder="🔒 စကားဝှက်">

<button class="loginBtn" id="loginBtn">

</button>

📝 အကောင့်အသစ်ဖွင့်မည်
</button>

<button class="loginBtn" id="guestBtn">
👻 ဧည့်သည်အဖြစ် ဝင်မည်
</button>

<span id="switchLink">
အကောင့်မရှိသေးဘူးလား? အသစ်ဖွင့်ရန်
</span>

</div>
</div>


<!-- ================= GAME ================= -->

<div id="gamePage">

<div id="topBar">

<div class="info">
🏆 <span id="scoreValue">0</span>
</div>

<div id="coinDisplay">
🪙 <span id="coinValue">500</span>
</div>

<div id="userInfo">
👤 <span id="gameUsername">Guest</span>
</div>

<button id="logoutBtn">
🚪 ထွက်
</button>

</div>

🎯 ငါးပစ်ဂိမ်း
</div>


<!-- FISH -->

<div class="fish" id="fish1">
🐠
</div>

<div class="fish" id="fish2">
🐟
</div>

<div class="fish" id="fish3">
🐡
</div>

<div class="fish" id="fish4">
🦈
</div>

<div class="fish" id="fish5">
🐋
</div>


<!-- CONTROLS -->

<div id="controls">

<button class="controlBtn" id="autoBtn">
AUTO
</button>

<button class="controlBtn" id="chatBtn">
💬 အကူအညီ
</button>

<button id="linkAccountOpenBtn" class="controlBtn" style="background:#8e44ad;display:none;">🔗 Account ချိတ်မည်</button>

<div id="linkAccountBox" style="display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(350px,90vw);z-index:1800;padding:22px;border-radius:20px;background:rgba(0,20,45,.98);border:2px solid #55ddff;box-shadow:0 0 35px rgba(0,200,255,.4);text-align:center;">
<h2 style="color:#ffd700;margin-bottom:8px;">🔗 Account ချိတ်မည်</h2>
<p style="color:#aaa;font-size:12px;margin-bottom:12px;">Guest ရထားတဲ့ Coin / Point တွေ မပျောက်ဘဲ Account ထဲ ဆက်သိမ်းမယ်။</p>
<input id="linkUsername" type="text" placeholder="👤 အကောင့်အမည်" style="width:100%;padding:11px;margin:5px 0;border-radius:10px;border:1px solid #55ddff;background:#001b3d;color:white;outline:none;">
<input id="linkPassword" type="password" placeholder="🔒 Password (6 လုံးအနည်းဆုံး)" style="width:100%;padding:11px;margin:5px 0;border-radius:10px;border:1px solid #55ddff;background:#001b3d;color:white;outline:none;">
<div id="linkAccountError" style="min-height:22px;color:#ff7777;font-size:12px;margin-top:5px;"></div>
<button id="linkAccountBtn" style="width:100%;padding:11px;margin-top:6px;border:0;border-radius:10px;font-weight:bold;background:linear-gradient(135deg,#ffd700,#f0a500);color:#001b3d;">🔗 Account ချိတ်မည်</button>
<button id="cancelLinkBtn" style="width:100%;padding:11px;margin-top:6px;border:0;border-radius:10px;font-weight:bold;background:#333;color:white;">ပိတ်မည်</button>
</div>

<div id="shotBox">

<button class="shotBtn active" data-cost="10">
10
</button>

<button class="shotBtn" data-cost="20">
20
</button>

<button class="shotBtn" data-cost="50">
50
</button>

<button class="shotBtn" data-cost="200">
200
</button>

</div>

</div>


<!-- CANNON -->

<div id="cannon">

<div id="barrel">
<div id="muzzle"></div>
</div>

<div id="cannonBase"></div>

</div>


<!-- CHAT -->

<div id="chatBox">

<div id="chatHeader">

<span>💬 အကူအညီတောင်းရန်</span>

<button id="closeChat">
✕
</button>

</div>

<div id="chatMessages"></div>

<div id="chatInputArea">

<input
id="chatInput"
type="text"
maxlength="500"
placeholder="အကူအညီလိုတာ ရေးပါ...">

<button id="sendChat">
ပို့
</button>

</div>

</div>

</div>


<!-- ================= FIREBASE ================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {
    apiKey:"AIzaSyC8JUDYpvTSotefo8xswN8fXVtF12kxIjM",
    authDomain:"komin-243c3.firebaseapp.com",
    databaseURL:"https://komin-243c3-default-rtdb.firebaseio.com",
    projectId:"komin-243c3",
    storageBucket:"komin-243c3.firebasestorage.app",
    messagingSenderId:"811139202151",
    appId:"1:811139202151:web:cc40c540bdcc9631bc28c2"
};


/* ================= REMOTE SETTINGS ================= */
const REMOTE_DEFAULTS={
  startingCoins:500,fishEnabled:true,fishSpeedMultiplier:1,autoEnabled:true,autoInterval:700,
  shotCosts:{10:true,20:true,50:true,200:true},
  fishHP:{fish1:2,fish2:3,fish3:4,fish4:6,fish5:10},
  fishRewards:{fish1:20,fish2:30,fish3:50,fish4:100,fish5:200}
};
let remoteSettings=JSON.parse(JSON.stringify(REMOTE_DEFAULTS));
let remoteSettingsStarted=false;
function applyRemoteSettings(raw){
  const r=raw||{};
  remoteSettings={...REMOTE_DEFAULTS,...r,shotCosts:{...REMOTE_DEFAULTS.shotCosts,...(r.shotCosts||{})},fishHP:{...REMOTE_DEFAULTS.fishHP,...(r.fishHP||{})},fishRewards:{...REMOTE_DEFAULTS.fishRewards,...(r.fishRewards||{})}};
  if(typeof fishMaxHP!=="undefined") fishIds.forEach(id=>{const v=Number(remoteSettings.fishHP[id]);if(Number.isFinite(v)&&v>=1)fishMaxHP[id]=v;});
  if(typeof rewards!=="undefined") fishIds.forEach(id=>{const v=Number(remoteSettings.fishRewards[id]);if(Number.isFinite(v)&&v>=0)rewards[id]=v;});
  if(typeof fishIds!=="undefined") fishIds.forEach(id=>{const el=document.getElementById(id);if(el)el.style.display=remoteSettings.fishEnabled?"":"none";});
  document.querySelectorAll(".shotBtn").forEach(btn=>{const c=String(Number(btn.dataset.cost));btn.style.display=remoteSettings.shotCosts[c]===false?"none":"";});
  const ab=document.getElementById("autoBtn");
  if(ab){ab.style.display=remoteSettings.autoEnabled?"":"none";if(remoteSettings.autoEnabled===false&&typeof autoMode!=="undefined"&&autoMode){autoMode=false;if(autoTimer)clearInterval(autoTimer);ab.innerText="AUTO";}}
  if(typeof resetFishHP==="function")resetFishHP();
}
function startRemoteSettings(){
  if(remoteSettingsStarted||!db)return;remoteSettingsStarted=true;
  db.ref("gameSettings").on("value",snap=>applyRemoteSettings(snap.exists()?snap.val():REMOTE_DEFAULTS),err=>console.error("Remote settings error",err));
}
/* ================= END REMOTE SETTINGS ================= */

let firebaseReady=false;
let auth=null;
let db=null;

try{

    firebase.initializeApp(firebaseConfig);

    auth=firebase.auth();
    db=firebase.database();

    firebaseReady=true;
    startRemoteSettings();

}catch(error){

    console.error("Firebase error:",error);

    document.getElementById("loginError").innerText=
        "❌ Firebase မတက်ပါ။ Internet / Firebase setting ကို စစ်ပါ။";

}


/* ================= VARIABLES ================= */

let currentUser=null;
let currentUsername="";
let isGuest=false;

let score=0;

let coins=Number(remoteSettings.startingCoins||500);

let registerMode=false;

let selectedCost=10;


/* ================= ELEMENTS ================= */

const loginPage=document.getElementById("loginPage");
const gamePage=document.getElementById("gamePage");

const loginUsername=document.getElementById("loginUsername");
const loginPassword=document.getElementById("loginPassword");

const loginError=document.getElementById("loginError");

const loginBtn=document.getElementById("loginBtn");
const registerBtn=document.getElementById("registerBtn");
const guestBtn=document.getElementById("guestBtn");

const switchLink=document.getElementById("switchLink");
const loginSubTitle=document.getElementById("loginSubTitle");


/* ================= USERNAME ================= */

function usernameKey(username){

    return username
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9_]/g,"");

}

function usernameEmail(username){

    return usernameKey(username)+"@fishgame.local";

}

function validUsername(username){

    return /^[A-Za-z0-9_]{3,20}$/.test(username);

}


/* ================= MESSAGE ================= */

function showMessage(text,good=true){

    const el=document.getElementById("message");

    el.innerText=text;

    el.style.color=
        good ? "#fff45c" : "#ff6b6b";

    clearTimeout(el._timer);

    el._timer=setTimeout(()=>{

        el.innerText="🎯 ငါးပစ်ဂိမ်း";
        el.style.color="#fff45c";

    },2200);

}


/* ================= LOGIN MODE ================= */

function setRegisterMode(){

    registerMode=true;

    loginSubTitle.innerText="အကောင့်အသစ်ဖွင့်ရန်";

    loginBtn.innerText="📝 အကောင့်အသစ်ဖွင့်မည်";

    registerBtn.style.display="none";

    switchLink.innerText="အကောင့်ရှိပြီးသားလား? ဝင်ရန်";

    loginError.innerText=
        "Username 3-20 လုံး • A-Z • a-z • 0-9 • _";

    loginError.style.color="#88ddff";

}


function setLoginMode(){

    registerMode=false;

    loginSubTitle.innerText="အကောင့်ဝင်ရန်";

    loginBtn.innerText="🔑 အကောင့်ဝင်မည်";

    registerBtn.style.display="block";

    switchLink.innerText=
        "အကောင့်မရှိသေးဘူးလား? အသစ်ဖွင့်ရန်";

    loginError.innerText="";

    loginError.style.color="#ff7777";

}


/* ================= REGISTER ================= */

async function registerAccount(){

    if(!firebaseReady){

        loginError.innerText=
            "❌ Firebase မတက်သေးပါ။";

        return;

                firebase.database.ServerValue.TIMESTAMP

        loginError.style.color="#6eff6b";

        );

    }catch(error){

        loginError.style.color="#ff7777";

        if(error.code==="auth/email-already-in-use"){

            loginError.innerText=
                "❌ ဒီအကောင့်အမည် အသုံးပြုပြီးသားပါ။";

        }else{

/* ================= START GAME ================= */

async function startGame(user,username,guest){

    currentUser=user;
    currentUsername=username;
    isGuest=guest;

    loginPage.style.display="none";
    gamePage.style.display="block";

    document.getElementById("gameUsername").innerText=username;

    const accountIdEl=document.getElementById("accountId");
    if(accountIdEl) accountIdEl.innerText="ID: "+user.uid;

    let data=null;
    let firebaseReadOK=false;
    let walletReadOK=false;
    let walletCoins=null;

    /* ID အလိုက် Coin Wallet */
    try{
        const snap=await db.ref("users/"+user.uid).once("value");
        firebaseReadOK=true;
        if(snap.exists()) data=snap.val();
    }catch(error){
        console.error("Firebase load error:",error);
    }

    if(firebaseReadOK){
        try{
            const walletSnap=await db.ref("wallets/"+user.uid+"/coins").once("value");
            walletReadOK=true;
            if(walletSnap.exists()) walletCoins=Number(walletSnap.val());
        }catch(error){
            console.error("Wallet load error:",error);
        }
    }

    /*
       Firebase ဖတ်မရတဲ့အချိန် data မရှိဘူးလို့
       မယူဆတော့ဘူး။ အဲဒီအချိန် 500 ကို ပြန်သတ်မှတ်ပြီး
       အရင် Coin ကို overwrite မလုပ်တော့ဘူး။
    */

    const cacheKey="fishgame_user_"+user.uid;
    let cached=null;

    try{

        cached=JSON.parse(
            localStorage.getItem(cacheKey) || "null"
        );

    }catch(error){

        cached=null;

    }

    /*
       Firebase က တကယ် data မရှိတာကို အတည်ပြုမှ
       အသစ်အဖြစ် 500 / 0 စမယ်။
    */

    if(!data && firebaseReadOK){

        data={
            username:username,
            usernameKey:usernameKey(username),
            accountId:user.uid,
            coins:Number(remoteSettings.startingCoins||500),
            score:0,
            guest:guest,
            linked:!guest
        };

        try{

            await db
            .ref("users/"+user.uid)
            .set(data);

        }catch(error){

            console.error("Initial Firebase save error:",error);

        }

    }

    /*
       Firebase read error ဖြစ်ရင် local cache ကို သုံးမယ်။
    */

    if(!data && cached){

        data=cached;

    }

    if(!data){

        data={
            username:username,
            coins:Number(remoteSettings.startingCoins||500),
            score:0,
            guest:guest
        };

    }

    score=Number(data.score);

    /* wallets/{UID}/coins ကို Coin အမှန်အဖြစ်သုံးမယ် */
    if(walletReadOK && Number.isFinite(walletCoins) && walletCoins>=0){
        coins=walletCoins;
    }else if(firebaseReadOK && data && Number.isFinite(Number(data.coins)) && Number(data.coins)>=0){
        /* အဟောင်း users/{UID}/coins ကနေ တစ်ကြိမ် migrate */
        coins=Number(data.coins);
        try{
            await db.ref("wallets/"+user.uid).set({
                coins:coins,
                accountId:user.uid,
                updatedAt:firebase.database.ServerValue.TIMESTAMP
            });
        }catch(error){
            console.error("Wallet migration error:",error);
        }
    }else{
        coins=Number(remoteSettings.startingCoins||500);
    }

    if(!Number.isFinite(score) || score<0) score=0;
    if(!Number.isFinite(coins) || coins<0) coins=Number(remoteSettings.startingCoins||500);

    try{

        localStorage.setItem(
            cacheKey,
            JSON.stringify({
                username:currentUsername,
                usernameKey:usernameKey(currentUsername),
                accountId:user.uid,
                coins:coins,
                score:score,
                guest:isGuest,
                linked:!isGuest,
                savedAt:Date.now()
            })
        );

    }catch(error){

        console.error("Cache save error:",error);

    }

    updateUI();
    resetFishHP();

    showMessage(
        guest
        ? "👻 Guest အဖြစ် ဝင်ပြီးပါပြီ!"
        : "🎯 မင်္ဂလာပါ "+username+"!"
    );

}

/* ================= SAVE ================= */

async function saveUser(){

    if(!currentUser)return;

    const cacheKey="fishgame_user_"+currentUser.uid;

    /*
       Local cache ကို အရင်သိမ်းမယ်။
       Refresh / Page close လုပ်ရင် Coin နောက်ဆုံးတန်ဖိုး
       မပျောက်အောင် ကာကွယ်ပေးတယ်။
    */

    const localData={
        username:currentUsername,
        usernameKey:usernameKey(currentUsername),
        accountId:currentUser.uid,
        coins:Number(coins),
        score:Number(score),
        guest:isGuest,
        linked:!isGuest,
        savedAt:Date.now()
    };

    try{

        localStorage.setItem(
            cacheKey,
            JSON.stringify(localData)
        );

    }catch(error){

        console.error("Local save error:",error);

    }

    /*
       Account နဲ့ နောက်တစ်ခါဝင်ရင် Firebase ကနေ
       Coin / Point ကို ပြန်ရအောင် Firebase ထဲလည်း သိမ်းမယ်။
    */

    if(!db)return;

    try{

        /* UID တစ်ခုချင်းစီအတွက် Coin ကို သီးသန့်သိမ်း */
        await db.ref("wallets/"+currentUser.uid).update({
            accountId:currentUser.uid,
            coins:Number(coins),
            updatedAt:firebase.database.ServerValue.TIMESTAMP
        });

        /* users/{UID} ထဲမှာ mirror value ထားမယ် */
        await db.ref("users/"+currentUser.uid).update({
            username:currentUsername,
            usernameKey:usernameKey(currentUsername),
            accountId:currentUser.uid,
            coins:Number(coins),
            score:Number(score),
            guest:isGuest,
            linked:!isGuest,
            updatedAt:firebase.database.ServerValue.TIMESTAMP
        });

    }catch(error){

        console.error("Firebase save error:",error);

    }

}

/* ================= FISH ================= */

const fishIds=[
    "fish1",
    "fish2",
    "fish3",
    "fish4",
    "fish5"
];

let fishMaxHP={

    fish1:2,
    fish2:3,
    fish3:4,
    fish4:6,
    fish5:10

};

const fishEmoji={

    fish1:"🐠",
    fish2:"🐟",
    fish3:"🐡",
    fish4:"🦈",
    fish5:"🐋"

};

let rewards={

    fish1:20,
    fish2:30,
    fish3:50,
    fish4:100,
    fish5:200

};

let currentHP={};
let fishPositions={};


function resetFishHP(){

    fishIds.forEach(id=>{

        currentHP[id]=fishMaxHP[id];

        updateHP(id);

        startFish(id);

    });

}


function updateHP(id){

    const bar=document.getElementById(
        "hp"+id.replace("fish","")
    );

    if(!bar)return;

    bar.style.width=
        (
            currentHP[id]/
            fishMaxHP[id]*
            100
        )+"%";

}


/* ================= FISH MOVEMENT ================= */

function startFish(id){

    if(fishPositions[id])return;

    const fish=document.getElementById(id);

    let y=15+Math.random()*60;

    let direction=Math.random()>.5;

    let x=direction?-15:115;

    let speed=(.15+Math.random()*.20)*Number(remoteSettings.fishSpeedMultiplier||1);

    fish.style.top=y+"%";
    fish.style.left=x+"%";

    fishPositions[id]={

        x:x,
        y:y,
        direction:direction,
        speed:speed

    };

    setInterval(()=>{

        const pos=fishPositions[id];

        if(!pos)return;

        if(pos.direction){

            pos.x+=pos.speed;

            if(pos.x>115){

                pos.x=-15;

                pos.y=
                    15+Math.random()*60;

                fish.style.top=
                    pos.y+"%";

                currentHP[id]=
                    fishMaxHP[id];

                updateHP(id);

            }

        }else{

            pos.x-=pos.speed;

            if(pos.x<-20){

                pos.x=115;

                pos.y=
                    15+Math.random()*60;

                fish.style.top=
                    pos.y+"%";

                currentHP[id]=
                    fishMaxHP[id];

                updateHP(id);

            }

        }

        fish.style.left=
            pos.x+"%";

    },30);

}


/* ================= CANNON ================= */

const cannon=
    document.getElementById("cannon");

const barrel=
    document.getElementById("barrel");

let cannonAngle=0;


function aimCannon(x,y){

    const rect=
        cannon.getBoundingClientRect();

    const centerX=
        rect.left+rect.width/2;

    const centerY=
        rect.top+rect.height/2;

    const dx=x-centerX;
    const dy=y-centerY;

    cannonAngle=
        Math.atan2(dx,-dy)
        *180/Math.PI;

    barrel.style.transform=
        "translate(-50%,-100%) rotate("+
        cannonAngle+"deg)";

}


/* ================= SHOOT ================= */

function shoot(){

    if(!currentUser){

        showMessage(
            "❌ အရင် Login ဝင်ပါ",
            false
        );

        return;

    }

    /* Virtual Coin ပစ်ခ */

    if(coins<selectedCost){

        showMessage(
            "❌ Coin မလုံလောက်ပါ",
            false
        );

        return;

    }

    coins-=selectedCost;
    updateUI();

    saveUser();


    const rect=
        cannon.getBoundingClientRect();

    let x=
        rect.left+
        rect.width/2;

    let y=
        rect.top+
        rect.height/2;

    const angle=
        cannonAngle*Math.PI/180;

    const speed=16;

    const bullet=
        document.createElement("div");

    bullet.className="bullet";

    gamePage.appendChild(bullet);

    let hit=false;


    function moveBullet(){

        if(hit)return;

        x+=Math.sin(angle)*speed;
        y-=Math.cos(angle)*speed;

        bullet.style.left=
            (x-4)+"px";

        bullet.style.top=
            (y-9)+"px";


        for(const id of fishIds){

            const fish=
                document.getElementById(id);

            const r=
                fish.getBoundingClientRect();

            if(
                x>=r.left &&
                x<=r.right &&
                y>=r.top &&
                y<=r.bottom
            ){

                hit=true;

                bullet.remove();

                currentHP[id]--;

                updateHP(id);


                const effect=
                    document.createElement("div");

                effect.className="hitEffect";
                effect.innerText="💥";

                effect.style.left=x+"px";
                effect.style.top=y+"px";

                gamePage.appendChild(effect);

                setTimeout(()=>{
                    effect.remove();
                },300);


                if(currentHP[id]<=0){

                    const reward=
                        rewards[id];

                    coins+=reward;
                    score+=reward;

                    updateUI();

                    showMessage(
                        "🎯 "+fishEmoji[id]+
                        " ရပြီး +"+
                        reward+
                        " Virtual Coin"
                    );


                    const float=
                        document.createElement("div");

                    float.className="coinFloat";
                    float.innerText=
                        "+"+reward+" 🪙";

                    float.style.left=x+"px";
                    float.style.top=y+"px";

                    gamePage.appendChild(float);

                    setTimeout(()=>{
                        float.remove();
                    },800);


                    setTimeout(()=>{

                        currentHP[id]=
                            fishMaxHP[id];

                        updateHP(id);

                        const pos=
                            fishPositions[id];

                        pos.x=
                            Math.random()>.5
                            ? -15
                            : 115;

                        pos.y=
                            15+
                            Math.random()*60;

                        fish.style.left=
                            pos.x+"%";

                        fish.style.top=
                            pos.y+"%";

                    },700);

                }else{

                    showMessage(
                        "💥 "+
                        fishEmoji[id]+
                        " ထိပါပြီ!"
                    );

                }

                saveUser();

                return;

            }

        }


        if(
            x<-60 ||
            x>innerWidth+60 ||
            y<-60 ||
            y>innerHeight+60
        ){

            hit=true;

            bullet.remove();

            return;

        }

        requestAnimationFrame(moveBullet);

    }

    requestAnimationFrame(moveBullet);

}

/* ================= GUEST ACCOUNT LINK ================= */

const linkOpenBtn=document.getElementById("linkAccountOpenBtn");
const linkBox=document.getElementById("linkAccountBox");
const linkBtn=document.getElementById("linkAccountBtn");
const cancelLinkBtn=document.getElementById("cancelLinkBtn");
const linkUserInput=document.getElementById("linkUsername");
const linkPassInput=document.getElementById("linkPassword");
const linkError=document.getElementById("linkAccountError");

function refreshLinkButton(){
    if(!linkOpenBtn)return;
    linkOpenBtn.style.display=(currentUser && currentUser.isAnonymous) ? "block" : "none";
}

linkOpenBtn.onclick=()=>{
    if(!currentUser || !currentUser.isAnonymous){
        showMessage("❌ Guest အဖြစ်ဝင်ထားမှ Account ချိတ်လို့ရပါတယ်",false);
        return;
    }
    linkBox.style.display="block";
    linkError.innerText="";
    linkUserInput.value="";
    linkPassInput.value="";
};

cancelLinkBtn.onclick=()=>{ linkBox.style.display="none"; };

linkBtn.onclick=async()=>{
    if(!currentUser || !currentUser.isAnonymous){
        linkError.innerText="❌ Guest account မဟုတ်ပါ";
        return;
    }
    const username=linkUserInput.value.trim();
    const password=linkPassInput.value;
    if(!validUsername(username)){
        linkError.innerText="❌ Username 3-20 လုံး (A-Z a-z 0-9 _)";
        return;
    }
    if(password.length<6){
        linkError.innerText="❌ Password အနည်းဆုံး 6 လုံး ထည့်ပါ";
        return;
    }
    linkBtn.disabled=true;
    linkError.style.color="#88ddff";
    linkError.innerText="⏳ Account ချိတ်နေပါတယ်...";
    try{
        const key=usernameKey(username);
        const nameSnap=await db.ref("usernames/"+key).once("value");
        if(nameSnap.exists()) throw new Error("USERNAME_EXISTS");
        const credential=firebase.auth.EmailAuthProvider.credential(usernameEmail(username),password);
        const result=await currentUser.linkWithCredential(credential);
        currentUser=result.user;
        await db.ref("usernames/"+key).set(currentUser.uid);
        await db.ref("users/"+currentUser.uid).update({
            username:username, usernameKey:key, accountId:currentUser.uid,
            coins:Number(coins), score:Number(score), guest:false, linked:true, linkedFromGuest:true,
            updatedAt:firebase.database.ServerValue.TIMESTAMP
        });
        currentUsername=username; isGuest=false; accountLinked=true;
        document.getElementById("gameUsername").innerText=username;
        const idEl=document.getElementById("accountId");
        if(idEl) idEl.innerText="ID: "+currentUser.uid;
        updateUI(); refreshLinkButton(); linkBox.style.display="none";
        showMessage("✅ Account ချိတ်ပြီးပါပြီ — Coin/Point မပျောက်ပါ");
    }catch(error){
        console.error("Account link error",error);
        linkError.style.color="#ff7777";
        if(error.message==="USERNAME_EXISTS" || error.code==="auth/email-already-in-use" || error.code==="auth/credential-already-in-use") linkError.innerText="❌ ဒီ Username ရှိပြီးသားပါ";
        else if(error.code==="auth/operation-not-allowed") linkError.innerText="❌ Firebase မှာ Email/Password Login ကို Enable လုပ်ပါ";
        else linkError.innerText="❌ Account ချိတ်မရပါ: "+(error.message||"");
    }finally{ linkBtn.disabled=false; }
};

/* ================= CHAT ================= */

const chatBox=
    document.getElementById("chatBox");

const chatMessages=
    document.getElementById("chatMessages");

const chatInput=
    document.getElementById("chatInput");


document.getElementById("chatBtn").onclick=()=>{

    chatBox.style.display="block";

    loadChat();

    setTimeout(()=>{
        chatInput.focus();
    },100);

};


document.getElementById("closeChat").onclick=()=>{

    chatBox.style.display="none";

};


/* ================= SEND CHAT ================= */

async function sendChat(){

    const text=
        chatInput.value.trim();

    if(!text)return;

    if(!currentUser)return;

    try{

        const ref=
            db.ref("supportMessages").push();

        await ref.set({

            uid:currentUser.uid,

            username:currentUsername,

            message:text,

            guest:isGuest,

            time:
                firebase.database.ServerValue.TIMESTAMP

        });

        chatInput.value="";

        loadChat();

    }catch(error){

        console.error(error);

        showMessage(
            "❌ စာပို့မရပါ",
            false
        );

    }

}


document.getElementById("sendChat")
.onclick=sendChat;


chatInput.addEventListener(
    "keydown",
    e=>{

        if(e.key==="Enter"){

            sendChat();

        }

    }
);


/* ================= LOAD CHAT ================= */

function loadChat(){

    if(!currentUser)return;

    db.ref("supportMessages")
    .limitToLast(50)
    .once("value")
    .then(snapshot=>{

        chatMessages.innerHTML="";

        const data=snapshot.val();

        if(!data){

            chatMessages.innerHTML=
                '<div style="color:#777;text-align:center;">'+
                'အကူအညီလိုပါက စာပို့ပါ'+
                '</div>';

            return;

        }

        Object.keys(data).forEach(key=>{

            const item=data[key];

            const div=
                document.createElement("div");

            div.className="chatMsg";


            const user=
                document.createElement("div");

            user.className="chatUser";

            user.innerText=
                item.username||"User";


            const msg=
                document.createElement("div");

            msg.innerText=
                item.message||"";


            const time=
                document.createElement("div");

            time.className="chatTime";

            if(item.time){

                time.innerText=
                    new Date(item.time)
                    .toLocaleString();

            }

            div.appendChild(user);
            div.appendChild(msg);
            div.appendChild(time);

            chatMessages.appendChild(div);

        });

        chatMessages.scrollTop=
            chatMessages.scrollHeight;

    });

}


/* ================= LOGIN ENTER ================= */

loginPassword.addEventListener(
    "keydown",
    e=>{

        if(e.key==="Enter"){

            loginBtn.click();

        }

    }
);


loginUsername.addEventListener(
    "keydown",
    e=>{

        if(e.key==="Enter"){

            loginPassword.focus();

        }

    }
);


/* ================= BUBBLES ================= */

for(let i=0;i<18;i++){

    const b=
        document.createElement("div");

    b.className="bubble";

    const size=
        5+Math.random()*18;

    b.style.width=size+"px";
    b.style.height=size+"px";

    b.style.left=
        Math.random()*100+"%";

    b.style.animationDuration=
        (5+Math.random()*8)+"s";

    b.style.animationDelay=
        (-Math.random()*10)+"s";

    gamePage.appendChild(b);

}


/* ================= AUTH STATE ================= */

if(firebaseReady){

    auth.onAuthStateChanged(
        user=>{

            if(!user)return;

            /*
             Page reload ဖြစ်တဲ့အခါ
             Anonymous Guest ကို ပြန်ဝင်ပေးမယ်။
            */

            if(user.isAnonymous){
                startGame(user,"Guest",true);
            }else{
                db.ref("users/"+user.uid).once("value").then(snap=>{
                    const data=snap.val()||{};
                    startGame(user,data.username||"Player",false);
                });
            }

            setTimeout(refreshLinkButton,300);

        }
    );

}

</script>


<script>
/* ===== COIN / POINT EMERGENCY SAVE ===== */
(function(){

  function emergencySave(){

    try{

      if(typeof currentUser !== "undefined" && currentUser){

        const key="fishgame_user_"+currentUser.uid;

        localStorage.setItem(
          key,
          JSON.stringify({
            username:currentUsername,
            usernameKey:usernameKey(currentUsername),
            accountId:currentUser.uid,
            coins:Number(coins),
            score:Number(score),
            guest:isGuest,
            linked:!isGuest,
            savedAt:Date.now()
          })
        );

      }

    }catch(error){

      console.error("Emergency cache save:",error);

    }

  }

  document.addEventListener(
    "visibilitychange",
    function(){

      if(document.visibilityState==="hidden"){

        emergencySave();

        if(typeof saveUser==="function"){
          saveUser();
        }

      }

    }
  );

  window.addEventListener("pagehide", emergencySave);

})();
</script>
