<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ငါးပြစ်ဂိမ်း</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
overflow:hidden;
height:100vh;
background:linear-gradient(to bottom,#001d3d,#003566,#0077b6,#00b4d8);
}

#game{
width:100%;
height:100vh;
position:relative;
}

.topbar{
position:absolute;
top:10px;
left:10px;
background:rgba(0,0,0,.5);
padding:10px 15px;
border-radius:15px;
color:white;
font-size:20px;
z-index:100;
}

.betbox{
position:absolute;
top:10px;
right:10px;
display:flex;
gap:5px;
z-index:100;
}

.betbtn{
padding:10px 15px;
border:none;
border-radius:10px;
font-weight:bold;
}

.message{
position:absolute;
top:70px;
left:50%;
transform:translateX(-50%);
color:yellow;
font-size:24px;
font-weight:bold;
z-index:100;
}

.fish{
position:absolute;
font-size:50px;
cursor:pointer;
user-select:none;
z-index:5;
}

.cannon{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
font-size:80px;
z-index:20;
}

.controls{
position:absolute;
bottom:35px;
left:20px;
display:flex;
gap:10px;
z-index:20;
}

.ctrlbtn{
width:60px;
height:60px;
border:none;
border-radius:50%;
font-size:28px;
font-weight:bold;
}

.shoot{
position:absolute;
bottom:20px;
right:20px;
width:100px;
height:100px;
border:none;
border-radius:50%;
background:red;
color:white;
font-size:25px;
font-weight:bold;
box-shadow:0 0 20px red;
z-index:20;
}

.sea{
position:absolute;
bottom:0;
width:100%;
height:120px;
background:rgba(0,100,0,.25);
}
</style>
</head>

<body>

<div id="game">

<div class="topbar">
💰 Coins : <span id="coins">1000</span>
</div>

<div class="betbox">
<button class="betbtn" onclick="bet=10">10</button>
<button class="betbtn" onclick="bet=50">50</button>
<button class="betbtn" onclick="bet=100">100</button>
</div>

<div class="message" id="msg">
🎯 ငါးကိုနှိပ်ပြီး ဖမ်းပါ
</div>

<div class="controls">
<button class="ctrlbtn" onclick="bet=Math.max(10,bet-10)">➖</button>
<button class="ctrlbtn" onclick="bet+=10">➕</button>
</div>

<div class="cannon">🔫</div>

<button class="shoot" onclick="shootFish()">
FIRE
</button>

<div class="sea"></div>

</div>

<script>

let coins = 1000;
let bet = 10;

function updateCoins(){
document.getElementById("coins").innerText = coins;
}

function shootFish(){

coins -= bet;

if(coins < 0){
coins = 0;
}

updateCoins();

document.getElementById("msg").innerHTML =
"💥 ပစ်လိုက်ပြီ - " + bet + " Coins";
}

function createFish(){

const fish = document.createElement("div");

fish.className = "fish";

const list = ["🐟","🐠","🐡","🦈"];

fish.innerHTML =
list[Math.floor(Math.random()*list.length)];

fish.style.top =
Math.random()*75 + "%";

fish.style.left = "-80px";

document.getElementById("game").appendChild(fish);

let pos = -80;

const move = setInterval(()=>{

pos += 3;

fish.style.left = pos + "px";

if(pos > window.innerWidth){

clearInterval(move);

fish.remove();

}

},30);

fish.onclick = function(){

coins += bet * 2;

updateCoins();

document.getElementById("msg").innerHTML =
"🎯 ထိမှန် + " + (bet*2) + " Coins";

fish.remove();

clearInterval(move);

};
}

setInterval(createFish,1500);

updateCoins();

</script>

</body>
</html>
