<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fish Shooter</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:sans-serif;
}

body{
background:linear-gradient(#0b9be0,#003b70);
}

#game{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
}

.topbar{
position:absolute;
top:10px;
left:10px;
right:10px;
display:flex;
justify-content:space-between;
z-index:100;
}

.box{
background:rgba(0,0,0,.5);
padding:10px 15px;
border-radius:10px;
color:#fff;
font-weight:bold;
}

.fish{
position:absolute;
font-size:45px;
cursor:pointer;
user-select:none;
}

.bottom-bar{
position:absolute;
bottom:0;
left:0;
width:100%;
height:90px;
background:rgba(0,120,140,.85);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
}

.power{
display:flex;
gap:10px;
}

.power button{
width:50px;
height:50px;
border:none;
border-radius:50%;
font-size:30px;
font-weight:bold;
}

.gun{
font-size:55px;
}

.fire-btn{
width:85px;
height:85px;
border:none;
border-radius:50%;
background:red;
color:white;
font-size:20px;
font-weight:bold;
box-shadow:0 0 15px red;
}
</style>
</head>

<body>

<div id="game">

<div class="topbar">
<div class="box">💰 Coins : <span id="coins">1000</span></div>
<div class="box">🎯 Score : <span id="score">0</span></div>
</div>

<div class="bottom-bar">

<div class="power">
<button onclick="downPower()">-</button>
<button onclick="upPower()">+</button>
</div>

<div class="gun">🔫</div>

<button class="fire-btn" onclick="fireGun()">FIRE</button>

</div>

</div>

<script>

let coins=1000;
let score=0;
let power=10;

function updateUI(){
document.getElementById("coins").innerText=coins;
document.getElementById("score").innerText=score;
}

function upPower(){
power+=10;
}

function downPower(){
if(power>10){
power-=10;
}
}

function fireGun(){

if(coins<power){
alert("Coins မလုံလောက်ပါ");
return;
}

coins-=power;
updateUI();
}

function createFish(){

const fish=document.createElement("div");

const fishes=["🐟","🐠","🐡","🦈"];

fish.className="fish";

fish.innerHTML=fishes[
Math.floor(Math.random()*fishes.length)
];

fish.style.top=Math.random()*70+"vh";
fish.style.left="-60px";

document.getElementById("game").appendChild(fish);

let x=-60;

const move=setInterval(()=>{

x+=3;

fish.style.left=x+"px";

if(x>window.innerWidth){
clearInterval(move);
fish.remove();
}

},30);

fish.onclick=function(){

score+=power*2;
coins+=power;

updateUI();

clearInterval(move);

fish.remove();

};

}

setInterval(createFish,1200);

updateUI();

</script>

</body>
</html>
