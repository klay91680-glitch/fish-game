<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ငါးပြစ်ဂိမ်း</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:450px;
background:#1e293b;
padding:20px;
border-radius:20px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,.4);
}

h1{
margin-bottom:15px;
}

.score-board{
background:#111827;
padding:15px;
border-radius:12px;
margin-bottom:15px;
font-size:20px;
font-weight:bold;
}

.bet-select{
width:100%;
padding:12px;
font-size:18px;
border:none;
border-radius:10px;
margin-bottom:15px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.fish-btn{
padding:25px 10px;
border:none;
border-radius:15px;
font-size:22px;
font-weight:bold;
color:white;
cursor:pointer;
}

.blue{
background:#3498db;
}

.gold{
background:#f1c40f;
color:black;
}

.red{
background:#e74c3c;
}

.result{
margin-top:15px;
background:#111827;
padding:15px;
border-radius:10px;
font-size:18px;
min-height:60px;
}

.reset-btn{
margin-top:15px;
padding:12px 25px;
background:#ef4444;
border:none;
border-radius:10px;
color:white;
font-size:18px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>🐟 ငါးပြစ်ဂိမ်း</h1>

<div class="score-board">
💰 Coins :
<span id="coins">1000</span>
<br><br>
🎣 ငါးမိ :
<span id="caught">0</span>
</div>

<select id="bet" class="bet-select">
<option value="10">10 Coins</option>
<option value="20">20 Coins</option>
<option value="40">40 Coins</option>
<option value="60">60 Coins</option>
<option value="100">100 Coins</option>
<option value="200">200 Coins</option>
<option value="500">500 Coins</option>
</select>

<div class="grid">

<button class="fish-btn blue"
onclick="playFish(2,30)">
🐟<br>
ငါးပြာ<br>
2x
</button>

<button class="fish-btn gold"
onclick="playFish(3,15)">
🐠<br>
ငါးရွှေ<br>
3x
</button>

<button class="fish-btn red"
onclick="playFish(5,5)">
🐡<br>
ငါးဖောင်း<br>
5x
</button>

</div>

<div class="result" id="result">
ငါးတစ်ကောင်ရွေးပြီး ပြစ်ပါ
</div>

<button class="reset-btn"
onclick="resetGame()">
🔄 Reset
</button>

</div>

<script>

let coins =
parseInt(localStorage.getItem("coins")) || 1000;

let caught =
parseInt(localStorage.getItem("caught")) || 0;

updateUI();

function updateUI(){

document.getElementById("coins").innerText =
coins;

document.getElementById("caught").innerText =
caught;

localStorage.setItem("coins",coins);
localStorage.setItem("caught",caught);

}

function playFish(multiplier,chance){

let bet =
parseInt(document.getElementById("bet").value);

if(coins < bet){

alert("Coins မလုံလောက်ပါ");

return;

}

coins -= bet;

let roll =
Math.random() * 100;

if(roll < chance){

let reward =
bet * multiplier;

coins += reward;

caught++;

document.getElementById("result").innerHTML =
"🎉 ငါးမိသွားတယ်! +" +
reward +
" Coins";

}else{

document.getElementById("result").innerHTML =
"❌ ငါးမမိပါ -" +
bet +
" Coins";

}

updateUI();

}

function resetGame(){

if(confirm("1000 Coins နဲ့ ပြန်စမလား?")){

coins = 1000;
caught = 0;

updateUI();

document.getElementById("result").innerHTML =
"🔄 1000 Coins နဲ့ ပြန်စပါပြီ";

}

}

</script>

</body>
    </html>
